<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <!-- Titanium Case Gradients -->
    <linearGradient id="titaniumBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="75%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <linearGradient id="caseHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="10%" stop-color="#1E293B"/>
      <stop offset="90%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Strap Gradient & Texture -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="15%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B111E"/>
    </linearGradient>

    <!-- Screen AMOLED Depth -->
    <radialGradient id="amoledScreen" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#131C2E"/>
      <stop offset="70%" stop-color="#070A10"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- Glass Glare Reflection -->
    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Mint Emerald Biometric Accents -->
    <linearGradient id="emeraldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="mintPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Device -->
  <circle cx="300" cy="375" r="280" fill="url(#mintGlow)"/>

  <g filter="url(#dropShadow)">
    <!-- Top Strap -->
    <path d="M 215,60 Q 215,30 300,30 Q 385,30 385,60 L 375,220 L 225,220 Z" fill="url(#strapGrad)"/>
    <!-- Top Strap Texture Grooves -->
    <line x1="235" y1="80" x2="365" y2="80" stroke="#0F172A" stroke-width="2.5" opacity="0.6"/>
    <line x1="238" y1="110" x2="362" y2="110" stroke="#0F172A" stroke-width="2.5" opacity="0.6"/>
    <line x1="240" y1="140" x2="360" y2="140" stroke="#0F172A" stroke-width="2.5" opacity="0.6"/>
    <line x1="242" y1="170" x2="358" y2="170" stroke="#0F172A" stroke-width="2.5" opacity="0.6"/>

    <!-- Bottom Strap -->
    <path d="M 225,530 L 375,530 L 385,690 Q 385,720 300,720 Q 215,720 215,690 Z" fill="url(#strapGrad)"/>
    <!-- Bottom Strap Texture Grooves & Buckle Pinholes -->
    <line x1="242" y1="580" x2="358" y2="580" stroke="#0F172A" stroke-width="2.5" opacity="0.6"/>
    <circle cx="300" cy="615" r="5" fill="#0B111E" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="300" cy="650" r="5" fill="#0B111E" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="300" cy="685" r="5" fill="#0B111E" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Digital Crown on Right -->
    <rect x="444" y="295" width="14" height="64" rx="5" fill="#475569" stroke="#1E293B" stroke-width="2"/>
    <line x1="446" y1="305" x2="456" y2="305" stroke="#1E293B" stroke-width="2"/>
    <line x1="446" y1="315" x2="456" y2="315" stroke="#1E293B" stroke-width="2"/>
    <line x1="446" y1="325" x2="456" y2="325" stroke="#1E293B" stroke-width="2"/>
    <line x1="446" y1="335" x2="456" y2="335" stroke="#1E293B" stroke-width="2"/>
    <line x1="446" y1="345" x2="456" y2="345" stroke="#1E293B" stroke-width="2"/>

    <!-- Secondary ECG Side Sensor Button -->
    <rect x="442" y="390" width="8" height="52" rx="4" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Aerospace Titanium Main Case -->
    <rect x="155" y="200" width="290" height="350" rx="68" fill="url(#titaniumBezel)" stroke="#64748B" stroke-width="3"/>
    <rect x="160" y="205" width="280" height="340" rx="64" fill="url(#caseHighlight)"/>

    <!-- Inner Bezel Ring -->
    <rect x="175" y="220" width="250" height="310" rx="52" fill="#0B0F19" stroke="#1F2937" stroke-width="2"/>

    <!-- Sapphire AMOLED Screen Display -->
    <rect x="182" y="227" width="236" height="296" rx="46" fill="url(#amoledScreen)"/>

    <!-- UI: Status Header -->
    <g font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">
      <text x="210" y="258" letter-spacing="1.5">PULSEFIT PRO</text>
      <text x="365" y="258" fill="#34D399" font-weight="700">98% ⚡</text>
    </g>

    <!-- UI: Time Display -->
    <text x="300" y="315" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
      10:42
    </text>
    <text x="300" y="335" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">
      THU, OCT 15 • 72°F
    </text>

    <!-- UI: Mint Biometric Health Gauge Ring -->
    <circle cx="300" cy="395" r="42" fill="none" stroke="#1E293B" stroke-width="8"/>
    <circle cx="300" cy="395" r="42" fill="none" stroke="url(#emeraldStroke)" stroke-width="8" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="66" filter="url(#mintPulse)"/>

    <!-- UI: Center Metric Inside Ring -->
    <text x="300" y="394" font-family="-apple-system, Inter, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      74
    </text>
    <text x="300" y="408" font-family="-apple-system, Inter, sans-serif" font-size="9" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">
      BPM
    </text>

    <!-- UI: Real-Time ECG Waveform Track -->
    <path d="M 205,455 L 245,455 L 255,443 L 265,472 L 275,435 L 285,462 L 295,455 L 395,455" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#mintPulse)"/>

    <!-- UI: Bottom Telemetry Badges -->
    <g font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600">
      <rect x="202" y="478" width="90" height="26" rx="6" fill="#1E293B" fill-opacity="0.7"/>
      <text x="212" y="495" fill="#94A3B8">SpO2: <tspan fill="#38BDF8" font-weight="800">99%</tspan></text>

      <rect x="308" y="478" width="90" height="26" rx="6" fill="#1E293B" fill-opacity="0.7"/>
      <text x="318" y="495" fill="#94A3B8">Cal: <tspan fill="#FBBF24" font-weight="800">842k</tspan></text>
    </g>

    <!-- Curved Sapphire Glass Glare Reflection -->
    <path d="M 185,230 Q 300,230 380,265 L 240,490 Q 185,460 185,380 Z" fill="url(#glassGlare)" pointer-events="none"/>
  </g>
</svg>
